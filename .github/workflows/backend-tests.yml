name: Backend Automated Testing & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit, API & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scms_test
          POSTGRES_USER: scms_test_user
          POSTGRES_PASSWORD: scms_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Backend
        working-directory: backend
        run: mvn -B compile

      - name: Run Backend Automated Tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/scms_test
          DB_USER: scms_test_user
          DB_PASSWORD: scms_test_password
          JWT_SECRET: 8a4c8f2b7a3d9e1f5c6b2a4d8e9f1c3b5a7d9e2f4c6b8a0d2e4f6c8a0b2d4e6f
          JWT_EXPIRATION: 86400000
          JWT_REFRESH_EXPIRATION: 604800000
          CLOUDINARY_CLOUD_NAME: ci_mock
          CLOUDINARY_API_KEY: 000000000000000
          CLOUDINARY_API_SECRET: ci_mock_secret
        run: mvn -B test

      - name: Upload Surefire Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

